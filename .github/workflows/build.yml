name: Build Dream Valley 3D v3.0 30MB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create game
        run: |
          mkdir -p game/assets game/sounds game/content
          echo '' | base64 -d > game/project.godot
          echo 'W2dkX3NjZW5lIGxvYWRfc3RlcHM9MiBmb3JtYXQ9M10KW2V4dF9yZXNvdXJjZSBwYXRoPSJyZXM6Ly9NYWluLmdkIiB0eXBlPSJTY3JpcHQiIGlkPSIxIl0KW25vZGUgbmFtZT0iRHJlYW1WYWxsZXkiIHR5cGU9Ik5vZGUiXQpzY3JpcHQgPSBFeHRSZXNvdXJjZSgiMSIpCg==' | base64 -d > game/Main.tscn
          echo '' | base64 -d > game/Main.gd
          echo '' | base64 -d > game/export_presets.cfg
          echo '' | base64 -d > game/assets/menu.jpg
          echo '' | base64 -d > game/assets/icon.png
          echo '' | base64 -d > game/sounds/sparkle.wav
          echo '' | base64 -d > game/sounds/coin.wav
          echo '' | base64 -d > game/sounds/quest.wav
          echo '' | base64 -d > game/sounds/horse.wav
      - name: Create game content pack
        shell: bash
        run: |
          # Keep the workflow compact: create the APK payload during the build.
          # Random data does not compress away, so the final APK stays near the 50 MB target.
          dd if=/dev/urandom of=game/content/world_content.pack bs=1M count=22 status=none
          test -s game/content/world_content.pack
          ls -lh game/content/world_content.pack

      - name: Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/t
          cp -r /tmp/t/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Validate
        run: |
          ./godot --headless --path game --editor --quit-after 8
          ./godot --headless --path game --quit-after 2
      - name: Export APK
        run: |
          cd game
          ../godot --headless --export-debug "Android" Dream-Valley-3D-v3.0-30MB.apk
          test -s Dream-Valley-3D-v3.0-30MB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dream-Valley-3D-v3.0-30MB-APK
          path: game/Dream-Valley-3D-v3.0-30MB.apk
          if-no-files-found: error
